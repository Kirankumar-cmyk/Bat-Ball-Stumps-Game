<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bat Ball Stump game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Bat Ball Stump game</h1>
    <button class="Bat" onclick="
    computerChoice= generateRandomOpt();
    let result;
    
    if(computerChoice=='Ball'){
        result='User chosen Bat <br>,'+ `Computer  chosen ${computerChoice}<br>`+' User has won 😊';
    }else if(computerChoice=='Stump'){
        result='User chosen Bat,<br> '+ `Computer  chosen ${computerChoice},<br>`+' Computer  has won 🖥️';
    }else{
        result='User chosen Bat,<br> '+ `Computer  chosen ${computerChoice},<br>`+` I'ts tie 🤝` ;
    }
    document.querySelector('.id').innerHTML=result;
    
    "></button>
    <button class="Ball" onclick="
     computerChoice=generateRandomOpt();
    
    if(computerChoice=='Stump'){
        result='User chosen Ball <br>,'+ `Computer chosen ${computerChoice}<br>`+' User has won 😊';
    }else if(computerChoice=='Bat'){
        result='User chosen Ball,<br> '+ `Computer  chosen ${computerChoice},<br>`+' Computer  has won 🖥️';
    }else{
        result='User chosen Ball,<br> '+ `Computer chosen ${computerChoice},<br>`+` I'ts tie 🤝` ;
    }
    document.querySelector('.id').innerHTML=result;
    
    "></button>
    <button class="Stumps" onclick="
    
    computerChoice=generateRandomOpt();
    if(computerChoice=='Bat'){
        result='User chosen Stumps <br>,'+ `Computer chosen ${computerChoice}<br>`+' User has won 😊';
    }else if(computerChoice=='Ball'){
        result='User chosen Stumps,<br> '+ `Computer chosen ${computerChoice},<br>`+' Computer  has won 🖥️';
    }else{
        result='User chosen Stumps,<br> '+ `Computer chosen ${computerChoice},<br>`+` I'ts tie 🤝` ;
    }
    document.querySelector('.id').innerHTML=result;
    
    "></button>
     <p class="id"></p>


     <script src="script.js"></script>
</body>
</html>
